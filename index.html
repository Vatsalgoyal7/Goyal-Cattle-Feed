<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goyal Business OS - Goyal Cattle Feed Pvt. Ltd.</title>
    <meta name="description" content="Enterprise Business OS and ERP platform for Goyal Cattle Feed Pvt. Ltd. with comprehensive sales, purchase, inventory, accounts, AI intelligence and factory operations control." />
    <meta name="theme-color" content="#065f46" />
    <meta property="og:title" content="Goyal Business OS - Goyal Cattle Feed Pvt. Ltd." />
    <meta property="og:description" content="Enterprise Business OS and ERP platform for Goyal Cattle Feed Pvt. Ltd. with comprehensive sales, purchase, inventory, accounts, and factory operations control." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA Service Worker for offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('[Goyal BOS] Service Worker registered. Scope:', reg.scope))
            .catch(err => console.warn('[Goyal BOS] Service Worker registration failed:', err));
        });
        // Listen for background sync messages
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SYNC_READY') {
            window.dispatchEvent(new CustomEvent('goyal-sync-ready'));
          }
        });
      }
    </script>
  </body>
</html>
